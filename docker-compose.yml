version: "3.8"

services:
  etcd:
    image: bitnami/etcd:latest
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - apisix_network

  apisix:
    image: apache/apisix:latest
    depends_on:
      - etcd
    ports:
      - "9080:9080" # APISIX port
      - "9092:9092" # APISIX control API
    volumes:
      - ./config/apisix.yaml:/usr/local/apisix/conf/config.yaml
    environment:
      - ETCD_HOST=http://etcd:2379
    networks:
      - apisix_network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - apisix_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - apisix_network

  jaeger:
    image: jaegertracing/all-in-one:1.41
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Jaeger collector
      - "14250:14250" # gRPC for traces
      - "6831:6831/udp" # Jaeger agent UDP
    networks:
      - apisix_network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 831374
      MYSQL_DATABASE: tag-microservice
    ports:
      - "3306:3306"
    networks:
      - apisix_network

  app:
    build: .
    depends_on:
      - db
      - jaeger
      - apisix
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: 831374
      MYSQL_DB: tag-microservice
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    networks:
      - apisix_network

networks:
  apisix_network:
    driver: bridge
